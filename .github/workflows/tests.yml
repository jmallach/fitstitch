name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e '.[test]'
      - name: Fetch public FIT corpus
        run: python tools/fetch_corpus.py
      - name: Fetch Garmin FitCSVTool
        run: python tools/fetch_fitcsvtool.py
      - name: Test
        run: pytest -q
