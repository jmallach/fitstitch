<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>fitstitch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22304f"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- part 1: a GPS track ending abruptly -->
  <path d="M20 104 C 34 98, 42 100, 44 84 S 46 66, 54 66"
        fill="none" stroke="#ff8a3d" stroke-width="9" stroke-linecap="round"/>
  <!-- part 2: picks up again a bit further on -->
  <path d="M76 60 C 84 60, 84 44, 90 38 S 102 30, 108 22"
        fill="none" stroke="#3ccfb4" stroke-width="9" stroke-linecap="round"/>

  <!-- the seam: cross stitches over the gap -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M58 54 L 72 72 M58 72 L 72 54"/>
  </g>

  <!-- start and finish -->
  <circle cx="20" cy="104" r="7" fill="#121a2e" stroke="#ff8a3d" stroke-width="4"/>
  <circle cx="108" cy="22" r="7" fill="#3ccfb4"/>
</svg>
