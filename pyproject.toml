[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fitstitch"
dynamic = ["version"]
description = "Join accidentally split FIT activities back into one, losslessly, from any device (Garmin, Suunto, Wahoo, Coros...)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordi Mallach", email = "jordi@mallach.net" }]
requires-python = ">=3.9"
dependencies = ["garmin-fit-sdk>=21.100"]
keywords = ["fit", "gps", "running", "cycling", "activity", "garmin", "suunto", "wahoo", "coros", "strava"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jmallach/fitstitch"
"Web app" = "https://jmallach.github.io/fitstitch/"
Issues = "https://github.com/jmallach/fitstitch/issues"

[project.optional-dependencies]
test = ["pytest", "fitdecode>=0.10"]

[project.scripts]
fit-stitch = "fitstitch.cli:main"
fit-split = "fitstitch.split:main"

[tool.setuptools]
packages = ["fitstitch"]

[tool.setuptools.dynamic]
version = { attr = "fitstitch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # fitdecode reports the deliberately malformed fields of some corpus files
    "ignore:invalid field size:UserWarning:fitdecode",
]
